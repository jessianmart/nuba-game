<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>NUBA HUD — Variante 1: Storm Cinematográfico</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1280px; height: 720px; overflow: hidden; }
body {
  font-family: 'Barlow Condensed', 'Noto Sans JP', sans-serif;
  color: #f4efe2;
  background:
    radial-gradient(ellipse 900px 520px at 50% 42%, #3d5a45 0%, #24352e 42%, #10161a 78%),
    #0c1013;
  position: relative;
}
body::after { content:''; position:fixed; inset:0; pointer-events:none;
  background: radial-gradient(ellipse 1200px 700px at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%); }

/* ===================== TOP BAR ===================== */
.hud-top-bar {
  position: absolute; top: 0; left: 0; right: 0; height: 48px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 10px; z-index: 30;
  background: linear-gradient(180deg, rgba(8,9,14,.94) 0%, rgba(8,9,14,.72) 62%, transparent 100%);
}
.team-block { display: flex; align-items: center; gap: 8px; }
.team-tag {
  font-family: 'Noto Sans JP'; font-weight: 900; font-size: 11px; letter-spacing: 2px;
  padding: 3px 8px; color: #f4efe2;
}
.team-block.blue .team-tag { background: #23407a; border: 1px solid rgba(120,160,255,.5); }
.team-block.red .team-tag { background: #7a1d1d; border: 1px solid rgba(255,130,120,.5); }
.portrait { width: 32px; height: 32px; border-radius: 3px; object-fit: cover;
  border: 1.5px solid rgba(232,201,106,.35); position: relative; }
.portrait.dead { filter: grayscale(1) brightness(.45); }
.pwrap { position: relative; }
.dot.r { background: #ff8080; box-shadow: 0 0 4px #ff8080; }
.rc { position: absolute; right: -3px; top: -3px; font-size: 9px; font-weight: 700; color: #fff;
  background: rgba(10,11,18,.95); border: 1px solid rgba(255,255,255,.25); border-radius: 50%;
  width: 14px; height: 14px; display: flex; align-items: center; justify-content: center; }
.portrait .dot { position: absolute; right: 2px; bottom: 2px; width: 5px; height: 5px; border-radius: 50%;
  background: #4ade80; box-shadow: 0 0 4px #4ade80; animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.digit { height: 26px; margin: 0 1px; image-rendering: auto; }
.center-cluster { display: flex; align-items: center; gap: 10px; }
.vs-crest { width: 40px; height: 24px; object-fit: contain; filter: drop-shadow(0 0 6px rgba(232,201,106,.5)); }
.clock { display: flex; align-items: baseline; gap: 2px; }
.clock .digit { height: 30px; }
.colon { font-size: 26px; font-weight: 700; color: #f4efe2; line-height: 30px; margin: 0 1px; }
.goal { font-size: 11px; letter-spacing: 1.5px; color: #cfc7b4; font-weight: 600; }
.hud-actions { display: flex; gap: 6px; }
.hud-actions button {
  width: 34px; height: 26px; border: 1px solid rgba(232,201,106,.25);
  background: rgba(14,16,22,.85); color: #cfc7b4; font-family: inherit;
  font-size: 11px; font-weight: 700; letter-spacing: .5px; cursor: pointer;
}
.hud-actions button:hover { border-color: rgba(232,201,106,.7); color: #f4e3a8; background: rgba(30,26,16,.95); }
.hud-actions button.danger { border-color: rgba(255,90,80,.4); color: #ff9a90; }

/* ===================== KILL FEED ===================== */
.kill-feed { position: absolute; top: 56px; right: 12px; display: flex; flex-direction: column; gap: 5px; z-index: 25; }
.kf-item { display: flex; align-items: center; gap: 6px; padding: 3px 8px 3px 4px;
  background: rgba(10,11,18,.88); border: 1px solid rgba(232,201,106,.22); border-radius: 3px; }
.kf-item img { width: 22px; height: 22px; border-radius: 2px; object-fit: cover; }
.kf-item .name { font-size: 12px; font-weight: 600; }
.kf-item .skill { font-size: 10px; color: #e8c96a; border: 1px solid rgba(232,201,106,.4); padding: 1px 5px; }
.kf-item.victim { opacity: .55; }

/* ===================== BOTTOM DECK ===================== */
.hud-bottom { position: absolute; left: 0; right: 0; bottom: 0; z-index: 30;
  display: flex; align-items: flex-end; justify-content: space-between; padding: 0 12px 10px; }
.minimap { width: 168px; height: 168px; position: relative;
  border-image: url('../../assets/ui/skin/panel_silver.png') 14 fill / 14px; }
.minimap .inner { position: absolute; inset: 12px; background:
  radial-gradient(circle at 50% 50%, #2e4438 0%, #16211c 70%); border-radius: 2px; overflow: hidden; }
.minimap .lbl { position: absolute; top: 14px; left: 14px; font-size: 10px; letter-spacing: 1.5px; color: #cfc7b4; z-index: 2; }
.mm-dot { position: absolute; width: 6px; height: 6px; border-radius: 50%; }
.mm-dot.b { background: #5b8dd6; box-shadow: 0 0 5px #5b8dd6; }
.mm-dot.r { background: #d65b5b; box-shadow: 0 0 5px #d65b5b; }
.mm-dot.me { width: 9px; height: 9px; background: #f4e3a8; box-shadow: 0 0 8px #f4e3a8; }

.command-deck { display: flex; align-items: center; gap: 14px; padding: 10px 14px;
  border-image: url('../../assets/ui/skin/panel_blue.png') 14 fill / 14px; }
.avatar-wrap { position: relative; width: 68px; height: 68px; flex: 0 0 auto; }
.avatar-wrap img.ring { position: absolute; inset: 0; width: 68px; height: 68px; }
.avatar-wrap img.face { position: absolute; inset: 6px; width: 56px; height: 56px; border-radius: 50%; object-fit: cover; }
.lvl-chip { position: absolute; left: 50%; transform: translateX(-50%); bottom: -6px; z-index: 2;
  background: #1a1408; border: 1px solid #e8c96a; color: #f4e3a8;
  font-size: 10px; font-weight: 700; padding: 1px 7px; letter-spacing: .5px; }
.gauges { display: flex; flex-direction: column; gap: 5px; width: 300px; }
.gauge { position: relative; height: 20px;
  border-image: url('../../assets/ui/skin/bar_frame.png') 18 fill / 18px stretch; }
.gauge .fill { position: absolute; inset: 6px 14px 6px 12px; transform-origin: left; border-radius: 2px; }
.gauge.hp .fill { width: 82%; background: linear-gradient(180deg, #71a34d 0%, #4f7a33 100%); }
.gauge.ck .fill { width: 64%; background: linear-gradient(180deg, #6fa3d8 0%, #3c6ea5 100%); }
.gauge .num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; letter-spacing: 1px; color: #fff; text-shadow: 0 1px 2px #000; }
.meta-line { display: flex; gap: 6px; align-items: center; }
.kda-chip { font-size: 11px; font-weight: 700; padding: 2px 8px; letter-spacing: .5px;
  background: rgba(10,11,18,.8); border: 1px solid rgba(232,201,106,.3); color: #f4efe2; }
.kda-chip b { color: #e8c96a; }
.awake-chip { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; padding: 2px 8px;
  background: linear-gradient(90deg, #8b1a1a, #c9a227); color: #fff; }

/* abilities ribbon */
.abilities { display: flex; gap: 8px; }
.slot { position: relative; width: 54px; height: 54px; cursor: pointer; background: rgba(8,9,14,.9);
  border-image: url('../../assets/ui/skin/panel_silver.png') 14 fill / 10px; }
.slot img.icon { position: absolute; inset: 7px; width: 40px; height: 40px; object-fit: contain; }
.slot .key { position: absolute; left: -4px; top: -4px; z-index: 3; font-size: 10px; font-weight: 700;
  background: #e8c96a; color: #12141c; padding: 1px 5px; letter-spacing: .5px; border-radius: 2px; }
.slot.ult .key { background: #ff5540; color: #fff; }
.slot .cd { position: absolute; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 700; color: #fff; text-shadow: 0 1px 3px #000;
  background: conic-gradient(rgba(0,0,0,.8) 62%, transparent 0); }
.slot .cost { position: absolute; right: 2px; bottom: 1px; font-size: 9px; font-weight: 700; color: #7fb4e8; z-index: 3; }
.slot:hover { filter: brightness(1.18); }
.slot.ready { animation: readyGlow 2.2s infinite; }
@keyframes readyGlow { 50% { box-shadow: 0 0 10px rgba(232,201,106,.35); } }

/* ougi banner flourish */
.ougi-banner { position: absolute; top: 120px; left: 50%; transform: translateX(-50%); z-index: 26;
  width: 460px; height: 76px;
  background-image: url('../../assets/ui/skin/ougi_bar.png'), url('../../assets/ui/skin/ougi_flare.png');
  background-size: 100% 100%, 140px 100%; background-position: 0 0, right center; background-repeat: no-repeat;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Noto Sans JP'; font-weight: 900; font-size: 26px; color: #fff;
  text-shadow: 0 0 12px rgba(255,85,64,.9); letter-spacing: 4px; }
.hint { position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
  font-size: 10px; letter-spacing: 2px; color: rgba(207,199,180,.55); z-index: 40; }
</style>
</head>
<body>
  <header class="hud-top-bar">
    <div class="team-block blue">
      <span class="team-tag">木ノ葉</span>
      <span class="score-digits">
        <img class="digit" src="../../assets/ui/skin/digit_2.png" alt="2"><img class="digit" src="../../assets/ui/skin/digit_3.png" alt="3">
      </span>
      <div class="pwrap"><img class="portrait" src="../../assets/portraits/1nrt.png"><span class="dot"></span></div>
      <div class="pwrap"><img class="portrait" src="../../assets/portraits/1skr.png"><span class="dot"></span></div>
      <div class="pwrap"><img class="portrait" src="../../assets/portraits/1kks.png"><span class="dot"></span></div>
      <div class="pwrap"><img class="portrait" src="../../assets/portraits/1hnt.png"><span class="dot"></span></div>
      <div class="pwrap"><img class="portrait dead" src="../../assets/portraits/1nej.png"><span class="rc">4</span></div>
    </div>
    <div class="center-cluster">
      <img class="vs-crest" src="../../assets/ui/xcmn_vs.png" alt="VS">
      <div class="clock">
        <img class="digit" src="../../assets/ui/skin/digit_0.png"><img class="digit" src="../../assets/ui/skin/digit_4.png"><span class="colon">:</span><img class="digit" src="../../assets/ui/skin/digit_2.png"><img class="digit" src="../../assets/ui/skin/digit_7.png">
      </div>
      <span class="goal">META 30</span>
    </div>
    <div class="team-block red" style="flex-direction: row-reverse;">
      <span class="team-tag">敵</span>
      <span class="score-digits">
        <img class="digit" src="../../assets/ui/skin/digit_1.png"><img class="digit" src="../../assets/ui/skin/digit_8.png">
      </span>
      <div class="pwrap"><img class="portrait" src="../../assets/portraits/1ssk.png"><span class="dot r"></span></div>
      <div class="pwrap"><img class="portrait" src="../../assets/portraits/1itc.png"><span class="dot r"></span></div>
      <div class="pwrap"><img class="portrait" src="../../assets/portraits/1gar.png"><span class="dot r"></span></div>
      <div class="pwrap"><img class="portrait dead" src="../../assets/portraits/1roc.png"><span class="rc">2</span></div>
      <div class="pwrap"><img class="portrait" src="../../assets/portraits/1jry.png"><span class="dot r"></span></div>
    </div>
    <nav class="hud-actions">
      <button title="Câmera (C)">CAM</button>
      <button title="Placar (Tab)">TAB</button>
      <button title="Teclas (H)">?</button>
      <button class="danger" title="Sair">✕</button>
    </nav>
  </header>

  <div class="kill-feed">
    <div class="kf-item">
      <img src="../../assets/portraits/1nrt.png"><span class="name">Naruto</span>
      <span class="skill">RASENGAN</span>
      <img src="../../assets/portraits/1ssk.png"><span class="name" style="color:#ff9a90">Sasuke</span>
    </div>
    <div class="kf-item victim">
      <img src="../../assets/portraits/1itc.png"><span class="name">Itachi</span>
      <span class="skill">KAWARIMI</span>
      <img src="../../assets/portraits/1skr.png"><span class="name" style="color:#8fb4ff">Sakura</span>
    </div>
  </div>

  <div class="ougi-banner">奥義 · RASENGAN</div>

  <footer class="hud-bottom">
    <div class="minimap">
      <div class="inner">
        <span class="lbl">SD00A · 5v5</span>
        <span class="mm-dot b" style="left:20%;top:30%"></span>
        <span class="mm-dot b" style="left:28%;top:44%"></span>
        <span class="mm-dot b" style="left:15%;top:56%"></span>
        <span class="mm-dot me" style="left:34%;top:36%"></span>
        <span class="mm-dot r" style="left:70%;top:60%"></span>
        <span class="mm-dot r" style="left:82%;top:48%"></span>
        <span class="mm-dot r" style="left:76%;top:30%"></span>
      </div>
    </div>
    <div class="command-deck">
      <div class="avatar-wrap">
        <img class="ring" src="../../assets/ui/skin/ring_avatar.png" alt="">
        <img class="face" src="../../assets/portraits/1nrt.png" alt="Naruto">
        <span class="lvl-chip">Lv.4</span>
      </div>
      <div class="gauges">
        <div class="gauge hp"><div class="fill"></div><span class="num">1820 / 2200</span></div>
        <div class="gauge ck"><div class="fill"></div><span class="num">CHAKRA 64 / 100</span></div>
        <div class="meta-line">
          <span class="kda-chip"><b>7</b> / 2 / <b>5</b></span>
          <span class="kda-chip">ABATES <b>23</b></span>
          <span class="awake-chip">Despertar</span>
        </div>
      </div>
      <div class="abilities">
        <div class="slot ready" data-k="atk"><span class="key">M1</span><img class="icon" src="../../assets/ui/skin/icon_atk.png"></div>
        <div class="slot ready" data-k="q"><span class="key">Q</span><img class="icon" src="../../assets/ui/skin/icon_q.png"></div>
        <div class="slot" data-k="w"><span class="key">E</span><img class="icon" src="../../assets/ui/skin/icon_w.png"><div class="cd">3.2s</div></div>
        <div class="slot" data-k="e"><span class="key">SPC</span><img class="icon" src="../../assets/ui/skin/icon_e.png"><span class="cost">15</span></div>
        <div class="slot ult ready" data-k="r"><span class="key">R</span><img class="icon" src="../../assets/ui/skin/icon_r.png"><span class="cost">50</span></div>
        <div class="slot" data-k="c"><span class="key">F</span><img class="icon" src="../../assets/ui/skin/icon_c.png"></div>
      </div>
    </div>
  </footer>
  <span class="hint">CLIQUE NUM SLOT PARA VER O COOLDOWN RADIAL</span>
<script>
  document.querySelectorAll('.slot').forEach(s => s.addEventListener('click', () => {
    const cd = s.querySelector('.cd') || (() => { const d = document.createElement('div'); d.className='cd'; s.appendChild(d); return d; })();
    cd.textContent = (2 + Math.random() * 4).toFixed(1) + 's';
    cd.animate([{ background: 'conic-gradient(rgba(0,0,0,.8) 100%, transparent 0)' },
                { background: 'conic-gradient(rgba(0,0,0,.8) 0%, transparent 0)' }], { duration: 1600 });
  }));
</script>
</body>
</html>
