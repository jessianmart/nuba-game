<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>NUBA HUD — Variante 3: Anime Cinematic Glass</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1280px; height: 720px; overflow: hidden; }
body {
  font-family: 'Barlow Condensed', 'Noto Sans JP', sans-serif;
  color: #f2f6ff;
  background:
    radial-gradient(ellipse 900px 520px at 50% 42%, #3d5a45 0%, #24352e 42%, #10161a 78%), #0c1013;
  position: relative;
}
body::after { content:''; position:fixed; inset:0; pointer-events:none;
  background: radial-gradient(ellipse 1200px 700px at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%); }
:root {
  --cyan: #57d4ff; --cyan-dim: rgba(87,212,255,.35);
  --glass: rgba(10,16,26,.68); --glass-brd: rgba(87,212,255,.22);
  --gold: #f5d76e;
}

/* ===================== TOP BAR ===================== */
.hud-top-bar { position: absolute; top: 8px; left: 0; right: 0; z-index: 30;
  display: flex; align-items: center; justify-content: center; gap: 18px; }
.team { display: flex; align-items: center; gap: 6px; padding: 6px 12px;
  background: var(--glass); border: 1px solid var(--glass-brd);
  clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); }
.team.red { clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 100%, 10px 100%); }
.portrait { width: 30px; height: 30px; object-fit: cover; border-radius: 50%; position: relative;
  border: 1.5px solid var(--cyan-dim); transform: rotate(-2deg); }
.team.red .portrait { border-color: rgba(255,110,100,.4); transform: rotate(2deg); }
.portrait.dead { filter: grayscale(1) brightness(.4); }
.portrait-wrap { position: relative; }
.rc { position: absolute; right: -3px; top: -3px; font-size: 9px; font-weight: 700; color: #fff;
  background: rgba(10,16,26,.95); border: 1px solid rgba(255,255,255,.25); border-radius: 50%;
  width: 14px; height: 14px; display: flex; align-items: center; justify-content: center; }
.score { font-size: 28px; font-weight: 700; letter-spacing: 2px; padding: 0 8px; }
.score.blue { color: var(--cyan); text-shadow: 0 0 16px var(--cyan-dim); }
.score.red { color: #ff8f88; text-shadow: 0 0 16px rgba(255,110,100,.4); }
.center { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 22px;
  background: var(--glass); border: 1px solid var(--glass-brd); backdrop-filter: blur(6px);
  clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 100%, 0 100%); }
.center .vs { height: 16px; }
.center .timer { font-size: 24px; font-weight: 700; letter-spacing: 3px; color: #fff; }
.center .goal { font-size: 9px; letter-spacing: 3px; color: #9fb4cf; }
.top-actions { position: absolute; right: 10px; top: 8px; display: flex; gap: 5px; }
.top-actions button { width: 30px; height: 24px; background: var(--glass); border: 1px solid var(--glass-brd);
  color: #9fb4cf; font-family: inherit; font-size: 10px; font-weight: 700; cursor: pointer; }
.top-actions button:hover { color: var(--cyan); border-color: var(--cyan-dim); }

/* ===================== KILL FEED ===================== */
.kill-feed { position: absolute; top: 64px; right: 12px; display: flex; flex-direction: column; gap: 5px; z-index: 25; }
.kf { display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 5px;
  background: var(--glass); border: 1px solid var(--glass-brd); backdrop-filter: blur(4px);
  clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); }
.kf img { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; }
.kf .n { font-size: 12px; font-weight: 600; }
.kf .j { font-family: 'Noto Sans JP'; font-size: 10px; font-weight: 900; letter-spacing: 2px;
  color: var(--gold); text-shadow: 0 0 8px rgba(245,215,110,.5); }
.kf.out { opacity: .5; }

/* ===================== OUGI FLASH ===================== */
.ougi { position: absolute; top: 110px; left: 50%; transform: translateX(-50%); z-index: 26;
  display: flex; align-items: center; gap: 14px; padding: 10px 34px;
  background: linear-gradient(90deg, transparent, rgba(255,90,60,.16) 30%, rgba(245,215,110,.2) 50%, rgba(255,90,60,.16) 70%, transparent);
  border-top: 1px solid rgba(245,215,110,.45); border-bottom: 1px solid rgba(245,215,110,.45); }
.ougi .jp { font-family: 'Noto Sans JP'; font-weight: 900; font-size: 22px; letter-spacing: 6px;
  color: #fff; text-shadow: 0 0 18px rgba(255,120,80,.9); }
.ougi .fl { width: 90px; height: 30px; object-fit: contain; filter: drop-shadow(0 0 10px rgba(255,150,60,.8)); }

/* ===================== BOTTOM DECK ===================== */
.hud-bottom { position: absolute; left: 0; right: 0; bottom: 10px; z-index: 30;
  display: flex; align-items: flex-end; justify-content: space-between; padding: 0 14px; gap: 12px; }
.minimap { width: 160px; height: 160px; position: relative; background: var(--glass);
  border: 1px solid var(--glass-brd); clip-path: polygon(0 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%); }
.mm-lbl { position: absolute; top: 6px; left: 10px; font-size: 9px; letter-spacing: 2px; color: #9fb4cf; z-index: 2; }
.mm-dot { position: absolute; width: 6px; height: 6px; border-radius: 50%; }
.mm-dot.b { background: var(--cyan); box-shadow: 0 0 6px var(--cyan-dim); }
.mm-dot.r { background: #ff6e64; box-shadow: 0 0 6px rgba(255,110,100,.5); }
.mm-dot.me { width: 9px; height: 9px; background: #fff; box-shadow: 0 0 10px var(--cyan); }
.deck { display: flex; align-items: center; gap: 16px; padding: 12px 18px;
  background: var(--glass); border: 1px solid var(--glass-brd); backdrop-filter: blur(8px);
  clip-path: polygon(20px 0, calc(100% - 20px) 0, 100% 100%, 0 100%); }
.avatar { position: relative; width: 66px; height: 66px; }
.avatar img.face { position: absolute; inset: 4px; width: 58px; height: 58px; border-radius: 50%; object-fit: cover; }
.avatar img.ring { position: absolute; inset: 0; width: 66px; height: 66px; opacity: .9;
  filter: drop-shadow(0 0 8px var(--cyan-dim)); animation: ringspin 14s linear infinite; }
@keyframes ringspin { to { transform: rotate(360deg); } }
.avatar .lvl { position: absolute; bottom: -2px; left: 50%; transform: translateX(-50%);
  font-size: 10px; font-weight: 700; color: var(--gold); background: rgba(10,16,26,.95);
  border: 1px solid rgba(245,215,110,.5); padding: 0 7px; letter-spacing: 1px; }
.vitals { display: flex; flex-direction: column; gap: 6px; width: 300px; }
.bar { position: relative; height: 19px; background: rgba(6,10,18,.8);
  border: 1px solid rgba(87,212,255,.18); overflow: hidden;
  clip-path: polygon(0 0, 100% 0, calc(100% - 8px) 100%, 0 100%); }
.bar .f { position: absolute; inset: 2px auto 2px 2px; }
.bar.hp .f { width: 80%; background: linear-gradient(90deg, rgba(87,255,140,.85), rgba(87,212,255,.7));
  box-shadow: 0 0 12px rgba(87,255,140,.35); }
.bar.ck .f { width: 64%; background: linear-gradient(90deg, rgba(87,212,255,.95), rgba(120,150,255,.8));
  box-shadow: 0 0 12px var(--cyan-dim); animation: shimmer 2.8s ease-in-out infinite; }
@keyframes shimmer { 50% { filter: brightness(1.35); } }
.bar .t { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; letter-spacing: 1.5px; color: #fff; text-shadow: 0 1px 3px #000; }
.meta { display: flex; gap: 8px; align-items: center; }
.chip { font-size: 11px; font-weight: 700; letter-spacing: 1px; padding: 2px 9px;
  background: rgba(6,10,18,.75); border: 1px solid rgba(87,212,255,.18); color: #cfe4f8; }
.chip b { color: var(--cyan); }
.chip.awake { border-color: rgba(245,215,110,.6); color: var(--gold);
  box-shadow: 0 0 12px rgba(245,215,110,.25); }
.abilities { display: flex; gap: 8px; }
.slot { position: relative; width: 54px; height: 54px; cursor: pointer;
  background: rgba(6,10,18,.85); border: 1px solid rgba(87,212,255,.2);
  clip-path: polygon(0 0, calc(100% - 9px) 0, 100% 9px, 100% 100%, 9px 100%, 0 calc(100% - 9px)); }
.slot img { position: absolute; inset: 8px; width: 38px; height: 38px; object-fit: contain;
  filter: drop-shadow(0 0 4px rgba(87,212,255,.25)); }
.slot .k { position: absolute; left: 4px; top: 3px; z-index: 3; font-size: 10px; font-weight: 700;
  color: var(--cyan); letter-spacing: 1px; text-shadow: 0 0 6px var(--cyan-dim); }
.slot .cd { position: absolute; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 700; color: #fff; text-shadow: 0 1px 3px #000;
  background: conic-gradient(rgba(4,6,10,.85) 62%, transparent 0); }
.slot.ult { border-color: rgba(245,215,110,.55); }
.slot.ult .k { color: var(--gold); text-shadow: 0 0 8px rgba(245,215,110,.5); }
.slot.ult img { filter: drop-shadow(0 0 6px rgba(245,215,110,.4)); }
.slot:hover { border-color: var(--cyan); }
.slot .cost { position: absolute; right: 3px; bottom: 2px; font-size: 9px; font-weight: 700; color: #7fc4ef; z-index: 3; }
.hint { position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
  font-size: 10px; letter-spacing: 2px; color: rgba(159,180,207,.55); z-index: 40; }
</style>
</head>
<body>
  <header class="hud-top-bar">
    <div class="team blue">
      <div class="portrait-wrap"><img class="portrait" src="../../assets/portraits/1nrt.png"></div>
      <div class="portrait-wrap"><img class="portrait" src="../../assets/portraits/1skr.png"></div>
      <div class="portrait-wrap"><img class="portrait" src="../../assets/portraits/1kks.png"></div>
      <div class="portrait-wrap"><img class="portrait" src="../../assets/portraits/1hnt.png"></div>
      <div class="portrait-wrap"><img class="portrait dead" src="../../assets/portraits/1nej.png"><span class="rc">4</span></div>
      <span class="score blue">23</span>
    </div>
    <div class="center">
      <img class="vs" src="../../assets/ui/xcmn_vs.png" alt="VS">
      <span class="timer">04:27</span>
      <span class="goal">META · 30 ABATES</span>
    </div>
    <div class="team red">
      <span class="score red">18</span>
      <div class="portrait-wrap"><img class="portrait" src="../../assets/portraits/1jry.png"></div>
      <div class="portrait-wrap"><img class="portrait dead" src="../../assets/portraits/1roc.png"><span class="rc">2</span></div>
      <div class="portrait-wrap"><img class="portrait" src="../../assets/portraits/1gar.png"></div>
      <div class="portrait-wrap"><img class="portrait" src="../../assets/portraits/1itc.png"></div>
      <div class="portrait-wrap"><img class="portrait" src="../../assets/portraits/1ssk.png"></div>
    </div>
  </header>
  <nav class="top-actions">
    <button>CAM</button><button>TAB</button><button>?</button><button>✕</button>
  </nav>

  <div class="kill-feed">
    <div class="kf"><img src="../../assets/portraits/1nrt.png"><span class="n">Naruto</span><span class="j">螺旋丸</span><img src="../../assets/portraits/1ssk.png"><span class="n" style="color:#ff8f88">Sasuke</span></div>
    <div class="kf out"><img src="../../assets/portraits/1itc.png"><span class="n">Itachi</span><span class="j">替わり</span><img src="../../assets/portraits/1skr.png"><span class="n" style="color:#57d4ff">Sakura</span></div>
  </div>

  <div class="ougi">
    <img class="fl" src="../../assets/ui/skin/ougi_flare.png" alt="">
    <span class="jp">奥義・螺旋丸</span>
    <img class="fl" src="../../assets/ui/skin/ougi_flare.png" style="transform:scaleX(-1)" alt="">
  </div>

  <footer class="hud-bottom">
    <div class="minimap">
      <span class="mm-lbl">SD00A</span>
      <span class="mm-dot b" style="left:20%;top:30%"></span>
      <span class="mm-dot b" style="left:28%;top:44%"></span>
      <span class="mm-dot me" style="left:34%;top:36%"></span>
      <span class="mm-dot r" style="left:70%;top:60%"></span>
      <span class="mm-dot r" style="left:82%;top:48%"></span>
    </div>
    <div class="deck">
      <div class="avatar">
        <img class="ring" src="../../assets/ui/skin/ring_avatar.png" alt="">
        <img class="face" src="../../assets/portraits/1nrt.png" alt="Naruto">
        <span class="lvl">Lv 4</span>
      </div>
      <div class="vitals">
        <div class="bar hp"><div class="f"></div><span class="t">1820 / 2200</span></div>
        <div class="bar ck"><div class="f"></div><span class="t">CHAKRA 64 / 100</span></div>
        <div class="meta">
          <span class="chip"><b>7</b> / 2 / <b>5</b></span>
          <span class="chip">ABATES <b>23</b></span>
          <span class="chip awake">✦ DESPERTAR</span>
        </div>
      </div>
      <div class="abilities">
        <div class="slot"><span class="k">M1</span><img src="../../assets/ui/skin/icon_atk.png"></div>
        <div class="slot"><span class="k">Q</span><img src="../../assets/ui/skin/icon_q.png"></div>
        <div class="slot"><span class="k">E</span><img src="../../assets/ui/skin/icon_w.png"><div class="cd">3.2s</div></div>
        <div class="slot"><span class="k">SPC</span><img src="../../assets/ui/skin/icon_e.png"><span class="cost">15</span></div>
        <div class="slot ult"><span class="k">R</span><img src="../../assets/ui/skin/icon_r.png"><span class="cost">50</span></div>
        <div class="slot"><span class="k">F</span><img src="../../assets/ui/skin/icon_c.png"></div>
      </div>
    </div>
  </footer>
  <span class="hint">CLIQUE NUM SLOT PARA VER O COOLDOWN RADIAL</span>
<script>
  document.querySelectorAll('.slot').forEach(s => s.addEventListener('click', () => {
    const cd = s.querySelector('.cd') || (() => { const d = document.createElement('div'); d.className='cd'; s.appendChild(d); return d; })();
    cd.textContent = (2 + Math.random() * 4).toFixed(1) + 's';
    cd.animate([{ background: 'conic-gradient(rgba(4,6,10,.85) 100%, transparent 0)' },
                { background: 'conic-gradient(rgba(4,6,10,.85) 0%, transparent 0)' }], { duration: 1600 });
  }));
</script>
</body>
</html>
