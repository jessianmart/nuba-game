<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>NUBA HUD — Variante 2: Esports Broadcast</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1280px; height: 720px; overflow: hidden; }
body {
  font-family: 'Rajdhani', 'Barlow Condensed', sans-serif;
  color: #e8ecf4;
  background:
    radial-gradient(ellipse 900px 520px at 50% 42%, #3d5a45 0%, #24352e 42%, #10161a 78%), #0c1013;
  position: relative;
}
body::after { content:''; position:fixed; inset:0; pointer-events:none;
  background: radial-gradient(ellipse 1200px 700px at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%); }

/* ===================== TOP BAR ===================== */
.hud-top-bar {
  position: absolute; top: 0; left: 0; right: 0; height: 46px; z-index: 30;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  background: linear-gradient(180deg, rgba(6,8,12,.97), rgba(6,8,12,.82) 70%, transparent);
}
.team { display: flex; align-items: center; gap: 7px; padding: 0 14px; height: 100%; }
.team.blue { justify-content: flex-start; border-bottom: 2px solid #3f6ec4; background: linear-gradient(90deg, rgba(47,84,153,.35), transparent 78%); }
.team.red { justify-content: flex-end; border-bottom: 2px solid #c4433f; background: linear-gradient(-90deg, rgba(153,47,44,.35), transparent 78%); }
.portrait { width: 30px; height: 30px; object-fit: cover; border-radius: 2px; position: relative;
  outline: 1.5px solid rgba(140,170,255,.55); filter: saturate(1.1); }
.team.red .portrait { outline-color: rgba(255,140,135,.55); }
.portrait.dead { filter: grayscale(1) brightness(.4); outline-color: rgba(255,255,255,.12); }
.portrait-wrap { position: relative; }
.portrait-wrap .cd { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px #000; background: rgba(10,12,16,.45); }
.score { font-size: 30px; font-weight: 700; line-height: 1; letter-spacing: 1px;
  min-width: 46px; text-align: center; }
.score.blue { color: #7fa8ff; text-shadow: 0 0 14px rgba(63,110,196,.6); }
.score.red { color: #ff9a94; text-shadow: 0 0 14px rgba(196,67,63,.6); }
.center { display: flex; align-items: center; gap: 14px; padding: 0 18px; height: 100%;
  background: #0b0d12; border-bottom: 2px solid #23262e; }
.center .timer { font-size: 26px; font-weight: 700; letter-spacing: 2px; color: #fff; }
.center .goal { font-size: 11px; font-weight: 600; letter-spacing: 2px; color: #8b93a5; text-align: center; line-height: 1.15; }
.top-actions { position: absolute; right: 8px; top: 52px; display: flex; flex-direction: column; gap: 4px; }
.top-actions button { width: 58px; height: 24px; font-family: inherit; font-size: 10px; font-weight: 700;
  letter-spacing: 1.5px; background: rgba(11,13,18,.85); color: #aab2c2;
  border: 1px solid #2a2e38; cursor: pointer; }
.top-actions button:hover { color: #fff; border-color: #4a5164; background: #141821; }

/* ===================== KILL FEED ===================== */
.kill-feed { position: absolute; top: 56px; right: 12px; display: flex; flex-direction: column; gap: 4px; z-index: 25; }
.kf { display: flex; align-items: center; gap: 7px; padding: 4px 9px;
  background: rgba(8,10,14,.92); border-left: 3px solid #3f6ec4; }
.kf.enemy { border-left-color: #c4433f; }
.kf img { width: 20px; height: 20px; object-fit: cover; border-radius: 2px; }
.kf .n { font-size: 12px; font-weight: 600; color: #dfe4ee; }
.kf .s { font-size: 10px; font-weight: 700; letter-spacing: 1px; color: #0b0d12; background: #cdd6e8; padding: 1px 6px; }
.kf.enemy .s { background: #e8c1b1; }

/* ===================== BOTTOM DECK ===================== */
.hud-bottom { position: absolute; left: 0; right: 0; bottom: 0; z-index: 30;
  display: flex; align-items: flex-end; justify-content: space-between; padding: 0 12px 12px; gap: 12px; }
.minimap { width: 168px; height: 168px; background: #0b0d12; border: 1px solid #2a2e38; position: relative; }
.minimap::before { content:''; position: absolute; inset: 6px; border: 1px dashed #23262e; }
.mm-lbl { position: absolute; top: 8px; left: 10px; font-size: 10px; font-weight: 700; letter-spacing: 2px; color: #6b7385; }
.mm-dot { position: absolute; width: 7px; height: 7px; border-radius: 1px; }
.mm-dot.b { background: #3f6ec4; }
.mm-dot.r { background: #c4433f; }
.mm-dot.me { width: 10px; height: 10px; background: #f2f5fa; border: 2px solid #3f6ec4; }
.deck { display: flex; align-items: center; gap: 16px; padding: 12px 16px;
  background: rgba(9,11,16,.94); border: 1px solid #2a2e38; border-bottom: none; }
.vitals { display: flex; flex-direction: column; gap: 6px; width: 320px; }
.vitals .lvl { font-size: 11px; font-weight: 700; color: #8b93a5; letter-spacing: 2px; }
.bar { position: relative; height: 18px; background: #10131a; border: 1px solid #23262e; }
.bar .f { position: absolute; inset: 2px auto 2px 2px; }
.bar.hp .f { width: 78%; background: linear-gradient(90deg, #3f9e56, #56c973); }
.bar.ck .f { width: 64%; background: linear-gradient(90deg, #2f74c9, #4a9aff); }
.bar .t { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; letter-spacing: 1.5px; color: #fff; text-shadow: 0 1px 2px #000; }
.meta { display: flex; gap: 8px; align-items: center; font-size: 12px; font-weight: 700; }
.meta .kda b { color: #7fa8ff; }
.meta .kills { color: #8b93a5; letter-spacing: 1px; font-weight: 600; }
.meta .ult { color: #f5c147; letter-spacing: 2px; border: 1px solid rgba(245,193,71,.5); padding: 1px 8px; font-size: 10px; }
.abilities { display: flex; gap: 7px; align-items: center; }
.slot { position: relative; width: 56px; height: 56px; background: #10131a; border: 1px solid #2a2e38; cursor: pointer; }
.slot img { position: absolute; inset: 8px; width: 40px; height: 40px; object-fit: contain; filter: saturate(1.15); }
.slot .k { position: absolute; left: 3px; top: 3px; font-size: 11px; font-weight: 700; color: #dfe4ee;
  text-shadow: 0 1px 2px #000; letter-spacing: .5px; }
.slot .cd { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 700; color: #fff; text-shadow: 0 1px 3px #000;
  background: conic-gradient(rgba(4,5,8,.85) 62%, transparent 0); }
.slot.ult { border-color: rgba(245,193,71,.55); box-shadow: inset 0 0 12px rgba(245,193,71,.12); }
.slot:hover { border-color: #4a5164; }
.slot .cost { position: absolute; right: 3px; bottom: 2px; font-size: 9px; font-weight: 700; color: #6fa3d8; }
.hint { position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
  font-size: 10px; letter-spacing: 2px; color: rgba(139,147,165,.6); z-index: 40; }
</style>
</head>
<body>
  <header class="hud-top-bar">
    <div class="team blue">
      <span class="score blue">23</span>
      <div class="portrait-wrap"><img class="portrait" src="../../assets/portraits/1nrt.png"></div>
      <div class="portrait-wrap"><img class="portrait" src="../../assets/portraits/1skr.png"></div>
      <div class="portrait-wrap"><img class="portrait" src="../../assets/portraits/1kks.png"></div>
      <div class="portrait-wrap"><img class="portrait" src="../../assets/portraits/1hnt.png"></div>
      <div class="portrait-wrap"><img class="portrait dead" src="../../assets/portraits/1nej.png"><span class="cd">4</span></div>
    </div>
    <div class="center">
      <div class="timer">04:27</div>
      <div class="goal">META<br>30 ABATES</div>
    </div>
    <div class="team red">
      <div class="portrait-wrap"><img class="portrait" src="../../assets/portraits/1jry.png"></div>
      <div class="portrait-wrap"><img class="portrait dead" src="../../assets/portraits/1roc.png"><span class="cd">2</span></div>
      <div class="portrait-wrap"><img class="portrait" src="../../assets/portraits/1gar.png"></div>
      <div class="portrait-wrap"><img class="portrait" src="../../assets/portraits/1itc.png"></div>
      <div class="portrait-wrap"><img class="portrait" src="../../assets/portraits/1ssk.png"></div>
      <span class="score red">18</span>
    </div>
  </header>
  <nav class="top-actions">
    <button>CAM</button><button>TAB</button><button>?</button><button style="color:#ff9a94;border-color:rgba(196,67,63,.5)">✕</button>
  </nav>

  <div class="kill-feed">
    <div class="kf"><img src="../../assets/portraits/1nrt.png"><span class="n">Naruto</span><span class="s">Q</span><img src="../../assets/portraits/1ssk.png"><span class="n" style="color:#ff9a94">Sasuke</span></div>
    <div class="kf enemy"><img src="../../assets/portraits/1itc.png"><span class="n">Itachi</span><span class="s">SPC</span><img src="../../assets/portraits/1skr.png"><span class="n" style="color:#7fa8ff">Sakura</span></div>
  </div>

  <footer class="hud-bottom">
    <div class="minimap">
      <span class="mm-lbl">SD00A</span>
      <span class="mm-dot b" style="left:20%;top:30%"></span>
      <span class="mm-dot b" style="left:28%;top:44%"></span>
      <span class="mm-dot me" style="left:34%;top:36%"></span>
      <span class="mm-dot r" style="left:70%;top:60%"></span>
      <span class="mm-dot r" style="left:82%;top:48%"></span>
    </div>
    <div class="deck">
      <div class="vitals">
        <span class="lvl">LV 4 · NARUTO</span>
        <div class="bar hp"><div class="f"></div><span class="t">1820 / 2200</span></div>
        <div class="bar ck"><div class="f"></div><span class="t">CHAKRA 64 / 100</span></div>
        <div class="meta">
          <span class="kda"><b>7</b> / 2 / <b>5</b></span>
          <span class="kills">ABATES 23</span>
          <span class="ult">ULT PRONTO</span>
        </div>
      </div>
      <div class="abilities">
        <div class="slot"><span class="k">M1</span><img src="../../assets/ui/skin/icon_atk.png"></div>
        <div class="slot"><span class="k">Q</span><img src="../../assets/ui/skin/icon_q.png"></div>
        <div class="slot"><span class="k">E</span><img src="../../assets/ui/skin/icon_w.png"><div class="cd">3.2s</div></div>
        <div class="slot"><span class="k">SPC</span><img src="../../assets/ui/skin/icon_e.png"><span class="cost">15</span></div>
        <div class="slot ult"><span class="k">R</span><img src="../../assets/ui/skin/icon_r.png"><span class="cost">50</span></div>
        <div class="slot"><span class="k">F</span><img src="../../assets/ui/skin/icon_c.png"></div>
      </div>
    </div>
  </footer>
  <span class="hint">CLIQUE NUM SLOT PARA VER O COOLDOWN RADIAL</span>
<script>
  document.querySelectorAll('.slot').forEach(s => s.addEventListener('click', () => {
    const cd = s.querySelector('.cd') || (() => { const d = document.createElement('div'); d.className='cd'; s.appendChild(d); return d; })();
    cd.textContent = (2 + Math.random() * 4).toFixed(1) + 's';
    cd.animate([{ background: 'conic-gradient(rgba(4,5,8,.85) 100%, transparent 0)' },
                { background: 'conic-gradient(rgba(4,5,8,.85) 0%, transparent 0)' }], { duration: 1600 });
  }));
</script>
</body>
</html>
